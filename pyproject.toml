[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fraud_detection"
version = "1.0.0"
description = "Enterprise Fraud Detection ML Inference & Governance Package"
authors = [{ name = "Lead AI/ML Engineer", email = "ml-team@enterprise.com" }]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "polars>=0.20.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "scikit-learn>=1.4.0",
    "catboost>=1.2.0",
    "joblib>=1.3.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "pyyaml>=6.0",
    "shap>=0.44.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.3.0",
    "mypy>=1.8.0"
]

[tool.setuptools.packages.find]
where = ["src"]

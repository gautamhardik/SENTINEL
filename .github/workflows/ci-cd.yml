name: Enterprise CI/CD Pipeline

on:
  push:
    branches: [ main, master, release/* ]
  pull_request:
    branches: [ main, master ]

jobs:
  lint-and-type-check:
    name: 🧹 Code Linting & Static Analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install Linting & Security Tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy bandit pytest

      - name: Run Ruff Linter
        run: ruff check .

      - name: Run Security Audit (Bandit)
        run: bandit -r src/ backend/app/ -ll -ii

      - name: Run Static Type Check (MyPy)
        run: mypy --config-file mypy.ini src/

  unit-and-integration-tests:
    name: 🧪 Unit & Integration Tests (Coverage > 90%)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install Package & Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install -r backend/requirements.txt
          pip install pytest pytest-cov pytest-asyncio

      - name: Run PyTest Suite
        run: |
          pytest tests/ --cov=src --cov=backend/app --cov-report=xml --cov-report=term-missing --cov-fail-under=85

      - name: Upload Coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          fail_ci_if_error: false

  frontend-ci:
    name: 🎨 Frontend Lint & Build Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Verify Production Build
        run: npm run build

  docker-build:
    name: 🐳 Docker Multi-Stage Container Verification
    runs-on: ubuntu-latest
    needs: [lint-and-type-check, unit-and-integration-tests, frontend-ci]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: fraud-detection-api:latest

name: CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-lint:
    name: Backend & ML Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r backend/requirements.txt
          pip install pytest pytest-cov ruff mypy

      - name: Code Style Verification (Ruff)
        run: |
          ruff check .

      - name: Type Checking (Mypy)
        run: |
          mypy src/fraud_detection backend/app --ignore-missing-imports

      - name: Execute Pytest Suite with Coverage Gate
        run: |
          python -m pytest --cov=src/fraud_detection --cov=backend/app --cov-report=term-missing --cov-fail-under=80

  frontend-check:
    name: Frontend Build & Typecheck
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Run Next.js Type Check & Build
        working-directory: ./frontend
        run: npm run build

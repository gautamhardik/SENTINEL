server:
  host: "0.0.0.0"
  port: 8000
  reload: false
  workers: 1

security:
  api_key_required: true
  api_key_header: "X-API-Key"
  default_api_key: "dev-secret-key-12345"
  cors_origins: ["*"]
  rate_limit_per_minute: 600

docs:
  title: "🛡️ Enterprise Fraud Detection REST API"
  description: "Production REST API serving CatBoost Fraud Champion Model predictions, probability calibration, risk thresholding, and SHAP explainability."
  version: "1.0.0"
  openapi_url: "/openapi.json"
  docs_url: "/docs"
  redoc_url: "/redoc"
